name: CDC integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cdc-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install psycopg2-binary confluent-kafka
      - run: python -m unittest discover -s tests -v
      - name: Start the disposable Compose stack
        run: |
          docker compose config --quiet
          docker compose up -d zookeeper kafka postgres connect clickhouse
          timeout 90 bash -c 'until docker compose exec -T postgres pg_isready -h 127.0.0.1 -U postgres; do sleep 2; done'
      - name: Verify replication, masking and latency
        run: |
          python -m scripts.smoke --rounds 5 --timeout 90 --output cdc-latency.json
          {
            echo '### Commit PostgreSQL → ClickHouse, dados sintéticos'
            echo '```json'
            cat cdc-latency.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: cdc-latency
          path: cdc-latency.json
      - name: Print container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 150
      - name: Remove test containers and volumes
        if: always()
        run: docker compose down --volumes
